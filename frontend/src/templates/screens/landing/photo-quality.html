  <section style="max-width:1240px;margin:0 auto;padding:0 40px 88px">
    <div style="background:#fff;border-radius:32px;padding:48px;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-direction:column;gap:10px;max-width:640px"><h2 style="margin:0;font-size:clamp(30px,3.2vw,44px);line-height:1.05;font-weight:800;letter-spacing:-0.04em">Когда результат хуже</h2><p style="margin:0;font-size:16px;line-height:1.55;color:#4A5368">Скажем об этом до оплаты. А чтобы получилось с первого раза — вот как снимать.</p></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px">
        <sc-for list="{{ badList }}" as="b" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:10px"><img src="{{ b.ico }}" alt="" style="width:60px;height:60px;margin:-6px 0 0 -6px"><span style="font-size:17px;font-weight:800">{{ b.title }}</span><span style="font-size:14px;line-height:1.5;color:#4A5368">{{ b.fix }}</span></div></sc-for>
      </div>
    </div>
  </section>
