  <section id="compare" style="position:relative;max-width:1240px;margin:0 auto;padding:56px 40px 24px">
    <div style="background:#fff;border:2px solid #1F4EF5;border-radius:32px;overflow:hidden;box-shadow:0 24px 60px rgba(31,78,245,.08)">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));align-items:stretch">
        <div style="display:flex;flex-direction:column;min-width:0">
<div lang="ru" style="display:flex;align-items:stretch;gap:2px;padding:0;background:#1F4EF5;flex:none">
        <sc-for list="{{ lTabs }}" as="t" hint-placeholder-count="5">
          <button onClick="{{ t.onClick }}" style="flex:1 1 0;min-width:0;min-height:84px;padding:12px 6px;border:none;border-radius:0;background:{{ t.bg }};color:{{ t.fg }};font-size:12px;line-height:1.2;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;text-wrap:balance;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;transition:background .2s ease,color .2s ease" style-hover="background:{{ t.hoverBg }}">
            <span style="width:30px;height:30px;flex:none;border-radius:10px;background:{{ t.icBg }};color:{{ t.icFg }};display:flex;align-items:center;justify-content:center;transition:background .2s ease,color .2s ease"><span class="material-symbols-rounded" style="font-size:18px">{{ t.icon }}</span></span>{{ t.label }}
          </button>
        </sc-for>
      </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:40px 44px;min-width:0">
          <div style="display:flex;flex-direction:column;gap:12px"><span style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1F4EF5">{{ lCopy.kicker }}</span><h2 style="margin:0;font-size:clamp(28px,2.8vw,40px);line-height:1.05;font-weight:800;letter-spacing:-0.04em;text-wrap:balance">{{ lCopy.title }}</h2><p style="margin:0;font-size:16px;line-height:1.55;color:#3A4156;text-wrap:pretty">{{ lCopy.text }}</p></div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;font-size:15px;line-height:1.45;color:#3A4156"><sc-for list="{{ lCopy.points }}" as="pt" hint-placeholder-count="4"><span style="display:flex;gap:10px"><span class="material-symbols-rounded" style="font-size:20px;color:#1F4EF5">check</span>{{ pt.t }}</span></sc-for></div>
          <div style="display:flex;flex-direction:column;border:1px solid #E3E7F2;border-radius:20px;overflow:hidden">
            <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:#F6F8FD;min-width:0">
              <span style="display:flex;align-items:center;gap:8px;min-width:0;flex:1"><span style="width:32px;height:32px;flex:none;border-radius:9px;background:#fff;border:1px solid #E3E7F2;color:#5B6478;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:18px">photo_camera</span></span><span style="font-size:13px;font-weight:600;color:#3A4156;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ lMeta.from }}</span></span>
              <span class="material-symbols-rounded" style="font-size:20px;color:#1F4EF5;flex:none">arrow_forward</span>
              <span style="display:flex;align-items:center;gap:8px;min-width:0;flex:1"><span style="width:32px;height:32px;flex:none;border-radius:9px;background:#1F4EF5;color:#fff;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:18px">description</span></span><span style="font-size:13px;font-weight:700;color:#0B1024;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ lMeta.to }}</span></span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
              <sc-for list="{{ lMeta.stats }}" as="s" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-left:1px solid #EEF1F7"><span style="font-size:22px;font-weight:800;letter-spacing:-0.03em;color:#0B1024">{{ s.v }}</span><span style="font-size:12px;color:#5B6478">{{ s.l }}</span></div></sc-for>
            </div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;min-height:48px">
            <button onClick="{{ goNew }}" style="flex:1 1 220px;justify-content:center;height:56px;padding:0 24px;border:none;border-radius:999px;background:#1F4EF5;color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px" style-hover="background:#1740D8">{{ lCopy.cta }}<span class="material-symbols-rounded" style="font-size:22px">arrow_forward</span></button>
          </div>
        </div>
        </div>
        <div style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:60px 28px 32px;min-width:0;background:#EFF0F3"><span aria-hidden="true" style="position:absolute;left:18px;top:14px;font-family:Caveat,cursive;font-size:24px;color:#1F4EF5;transform:rotate(-4deg)">тяните ←→</span>
          <div style="position:relative;width:456px;height:645px;flex:none;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(11,16,36,.06),0 18px 40px rgba(11,16,36,.12)">
          <div style="position:absolute;inset:0"><dc-import name="DocSheet" page="{{ lTab.page }}" variant="photo" zoom="0.76" straight="{{ true }}" flat="{{ true }}" hint-size="456px,645px"></dc-import></div>
          <div style="position:absolute;inset:0;clip-path:inset(0 0 0 {{ sliderPct }});background:#fff"><dc-import name="DocSheet" page="{{ lTab.page }}" variant="word" zoom="0.76" flat="{{ true }}" hint-size="456px,645px"></dc-import></div>
          <div style="position:absolute;top:0;bottom:0;left:{{ sliderPct }};width:3px;margin-left:-1.5px;background:#1F4EF5;pointer-events:none"><span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:20px;background:#1F4EF5;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(31,78,245,.4)"><span class="material-symbols-rounded" style="font-size:22px">code</span></span></div>
          <span style="position:absolute;left:10px;top:10px;height:24px;padding:0 10px;border-radius:12px;background:rgba(11,16,36,.72);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;pointer-events:none">Фото</span>
          <span style="position:absolute;right:10px;top:10px;height:24px;padding:0 10px;border-radius:12px;background:#1F4EF5;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;pointer-events:none">Наш Word</span>
          <input type="range" min="0" max="100" value="{{ L.slider }}" onChange="{{ onSlider }}" aria-label="Сравнить фото и Word" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0">
        </div>
        </div>
      </div>
    </div>
  </section>
