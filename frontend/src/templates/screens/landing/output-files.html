  <section style="position:relative;isolation:isolate;overflow:hidden;max-width:1240px;margin:0 auto;padding:0 40px 88px;display:flex;flex-direction:column;gap:28px">
    <h2 style="margin:0;font-size:clamp(34px,3.8vw,52px);line-height:1.02;font-weight:800;letter-spacing:-0.045em;max-width:720px">Из одного фото — четыре файла</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
      <sc-for list="{{ outFiles }}" as="f" hint-placeholder-count="4"><div style="background:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px"><img src="{{ f.ico }}" alt="" style="width:68px;height:68px"><span style="font-size:18px;font-weight:800">{{ f.title }}</span><span style="font-size:14px;line-height:1.5;color:#4A5368">{{ f.text }}</span></div></sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
      <div style="background:#EEF3FF;border-radius:24px;padding:22px;display:flex;gap:16px;align-items:center"><span style="font-family:Caveat,cursive;font-size:40px;color:#22409A;transform:rotate(-8deg)">Соколова</span><span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:16px;font-weight:800">Своя подпись на нужной линии</span><span style="font-size:14px;color:#4A5368">Нарисуйте или загрузите — поставим куда скажете.</span></span></div>
      <div style="background:#EEF3FF;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px"><span style="font-size:16px;font-weight:800">Правки командой</span><span style="height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:15px;color:#0B1024;gap:10px"><span class="material-symbols-rounded" style="font-size:20px;color:#1F4EF5">edit</span>замени 2024 на 2025</span></div>
    </div>
  </section>
