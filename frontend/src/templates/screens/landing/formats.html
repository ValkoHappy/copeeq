  <section style="max-width:1240px;margin:0 auto;padding:8px 40px 0">
    <div style="background:#fff;border-radius:24px;padding:16px 24px;display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(11,16,36,.04)">
      <span style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A90A2">Принимаем</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{ inFmts }}" as="f"><span style="height:32px;padding:0 12px;border-radius:999px;background:#F3F5FA;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px"><img src="{{ f.ico }}" alt="" style="width:24px;height:24px;margin-left:-6px">{{ f.t }}</span></sc-for></div>
      <span class="material-symbols-rounded" style="font-size:22px;color:#1F4EF5">arrow_forward</span>
      <span style="font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A90A2">Отдаём</span>
      <div style="display:flex;gap:6px 18px;flex-wrap:nowrap;flex:none"><sc-for list="{{ outFmts }}" as="f"><span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;white-space:nowrap"><img src="{{ f.ico }}" alt="" style="width:36px;height:36px;margin:-4px -2px -4px -4px">{{ f.t }}</span></sc-for></div>
    </div>
  </section>
