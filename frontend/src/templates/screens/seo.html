<sc-if value="{{ isSeo }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Конверсия" style="max-width:1240px;margin:0 auto;padding:56px 40px 40px;display:flex;flex-direction:column;gap:48px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:40px;align-items:center">
    <div style="display:flex;flex-direction:column;gap:18px"><h1 style="margin:0;font-size:clamp(40px,5vw,64px);line-height:1;font-weight:800;letter-spacing:-0.05em">{{ seo.h }}</h1><p style="margin:0;font-size:18px;line-height:1.5;color:#4A5368">{{ seoLead }}</p><span style="font-size:14px;font-weight:700;color:#15803D">25 кредитов бесплатно после регистрации</span></div>
    <div onClick="{{ pickFile }}" onDragOver="{{ dzOver }}" onDragLeave="{{ dzLeave }}" onDrop="{{ dzDrop }}" style="background:#fff;border-radius:28px;padding:10px;cursor:pointer;box-shadow:0 24px 60px rgba(11,16,36,.1)"><div style="border:2px dashed {{ dzBorder }};background:{{ dzBg }};border-radius:20px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center"><img src="{{ upIco }}" alt="" style="width:68px;height:68px;flex:none"><span style="font-size:20px;font-weight:800">Загрузите {{ seo.from }}</span><span style="font-size:13px;color:#5B6478">Перетащите сюда или выберите файл · Ctrl+V</span><span style="height:48px;padding:0 24px;border-radius:999px;background:#1F4EF5;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px"><span class="material-symbols-rounded" style="font-size:20px">folder_open</span>Выбрать файл</span></div></div>
  </div>
  <div style="background:#EDEBE6;border-radius:32px;padding:36px 24px;display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center"><dc-import name="DocSheet" page="{{ seoPage }}" variant="photo" zoom="0.5" hint-size="298px,421px"></dc-import><span style="font-size:14px;font-weight:800">Было: {{ seo.from }}</span></div>
    <span class="material-symbols-rounded" style="font-size:40px;color:#1F4EF5">arrow_forward</span>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center"><dc-import name="DocSheet" page="{{ seoPage }}" variant="word" zoom="0.5" hint-size="298px,421px"></dc-import><span style="font-size:14px;font-weight:800">Стало: {{ seo.to }}</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px">
    <sc-for list="{{ steps3 }}" as="s"><div style="display:flex;flex-direction:column;gap:10px"><img src="{{ s.ico }}" alt="" style="width:60px;height:60px;margin:-4px 0 0 -4px"><span style="font-size:19px;font-weight:800">{{ s.t }}</span><span style="font-size:15px;line-height:1.5;color:#4A5368">{{ s.d }}</span></div></sc-for>
  </div>
</div>
</sc-if>
