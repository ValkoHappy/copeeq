<sc-if value="{{ isFaq }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Вопросы" style="max-width:900px;margin:0 auto;padding:40px 40px 48px;display:flex;flex-direction:column;gap:24px">
  <h1 style="margin:0;font-size:clamp(34px,3.6vw,46px);line-height:1;font-weight:800;letter-spacing:-0.05em">Вопросы</h1>
  <div style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ allFaq }}" as="q" hint-placeholder-count="10"><div style="background:#fff;border-radius:20px"><button onClick="{{ q.onClick }}" style="width:100%;display:flex;align-items:center;gap:16px;padding:20px 24px;border:none;background:none;text-align:left;cursor:pointer;font-size:17px;font-weight:800;color:#0B1024"><span style="flex:1">{{ q.q }}</span><span class="material-symbols-rounded" style="font-size:24px;color:#1F4EF5">{{ q.icon }}</span></button><sc-if value="{{ q.open }}"><div style="padding:0 24px 22px;font-size:15px;line-height:1.6;color:#4A5368">{{ q.a }}</div></sc-if></div></sc-for>
  </div>
  <div style="background:#0B1024;color:#fff;border-radius:24px;padding:24px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap"><span style="flex:1;font-size:17px;font-weight:800;min-width:220px">Не нашли ответ?</span><a href="mailto:support@copeeq.ru" style="height:46px;padding:0 20px;border-radius:999px;background:#fff;color:#0B1024;font-size:14px;font-weight:800;display:flex;align-items:center;text-decoration:none">support@copeeq.ru</a></div>
</div>
</sc-if>
