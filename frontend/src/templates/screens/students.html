<sc-if value="{{ isStudents }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Студентам" style="max-width:1240px;margin:0 auto;padding:56px 40px 40px;display:flex;flex-direction:column;gap:40px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:40px;align-items:center">
    <div style="display:flex;flex-direction:column;gap:16px"><h1 style="margin:0;font-size:clamp(40px,5vw,64px);line-height:1;font-weight:800;letter-spacing:-0.05em">Подготовьте учебные материалы в Word</h1><p style="margin:0;font-size:18px;line-height:1.5;color:#4A5368">Перенесите конспект, методичку или распечатку в Word. Режим «Чистовик» поможет задать поля, шрифт и интервалы. Сверьте настройки с требованиями преподавателя.</p><button onClick="{{ goNew }}" style="align-self:flex-start;height:56px;padding:0 28px;border:none;border-radius:999px;background:#1F4EF5;color:#fff;font-size:16px;font-weight:800;cursor:pointer">Загрузить работу</button></div>
    <img src="assets/ex-notes.png" alt="" style="width:100%;max-width:440px;justify-self:center;mix-blend-mode:multiply">
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
    <sc-for list="{{ stuCards }}" as="c" hint-placeholder-count="3"><div style="background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px"><img src="{{ c.ico }}" alt="" style="width:60px;height:60px;margin:-6px 0 0 -6px"><span style="font-size:18px;font-weight:800">{{ c.t }}</span><span style="font-size:14px;line-height:1.5;color:#4A5368">{{ c.d }}</span></div></sc-for>
  </div>
</div>
</sc-if>
