<sc-if value="{{ isSecurity }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Безопасность" style="max-width:1000px;margin:0 auto;padding:56px 40px 40px;display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><img src="{{ secIco }}" alt="" style="width:104px;height:104px"><div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:10px"><h1 style="margin:0;font-size:clamp(38px,4.6vw,58px);line-height:1;font-weight:800;letter-spacing:-0.05em">Данные и безопасность</h1><p style="margin:0;font-size:17px;line-height:1.5;color:#4A5368">Здесь описано, как текущая версия работает с файлами и изменениями. Обработка показана на готовых примерах.</p></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
    <sc-for list="{{ secCards }}" as="c" hint-placeholder-count="6"><div style="background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px"><img src="{{ c.ico }}" alt="" style="width:60px;height:60px;margin:-6px 0 0 -6px"><span style="font-size:17px;font-weight:800">{{ c.t }}</span><span style="font-size:14px;line-height:1.55;color:#4A5368">{{ c.d }}</span></div></sc-for>
  </div>
</div>
</sc-if>
