<sc-if value="{{ isEditor }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Редактор" style="display:flex;flex-direction:column;height:100%">
  <div style="min-height:52px;flex:none;background:#fff;border-bottom:1px solid #ECEAF0;display:flex;align-items:center;gap:4px;padding:6px 14px;flex-wrap:wrap">
    <sc-for list="{{ tbGroups }}" as="g" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid #ECEAF0">
        <sc-for list="{{ g.items }}" as="t"><button onMouseDown="{{ keepFocus }}" onClick="{{ t.onClick }}" title="{{ t.title }}" style="width:34px;height:34px;border:none;border-radius:9px;background:transparent;color:#3A4156;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:#F1F0F4"><span class="material-symbols-rounded" style="font-size:20px">{{ t.icon }}</span></button></sc-for>
      </div>
    </sc-for>
    <div style="display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid #ECEAF0">
      <span style="font-size:12px;font-weight:700;color:#5B6478">Годы</span>
      <button onClick="{{ yearDown }}" title="На год назад" style="width:28px;height:28px;border:1px solid #E3E1EA;border-radius:14px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:16px">remove</span></button>
      <span style="min-width:24px;text-align:center;font-size:13px;font-weight:800">{{ shiftLabel }}</span>
      <button onClick="{{ yearUp }}" title="На год вперёд" style="width:28px;height:28px;border:1px solid #E3E1EA;border-radius:14px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:16px">add</span></button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;padding:0 8px">
      <input value="{{ edFind }}" onChange="{{ onEdFind }}" placeholder="Найти" style="width:110px;height:32px;border:1px solid #E3E1EA;border-radius:9px;padding:0 9px;font-size:13px;outline:none" style-focus="border-color:#1F4EF5">
      <input value="{{ edRepl }}" onChange="{{ onEdRepl }}" placeholder="Заменить на" style="width:110px;height:32px;border:1px solid #E3E1EA;border-radius:9px;padding:0 9px;font-size:13px;outline:none" style-focus="border-color:#1F4EF5">
      <button onClick="{{ edReplaceAll }}" style="height:32px;padding:0 12px;border:none;border-radius:9px;background:#0B1024;color:#fff;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap">Заменить все</button>
    </div>
    <div style="flex:1"></div>
    <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ edSave.fg }};white-space:nowrap"><span class="material-symbols-rounded" style="font-size:17px">{{ edSave.icon }}</span>{{ edSave.t }}</span>
  </div>
  <div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px">
    <div ref="{{ viewerRef }}" style="overflow:auto;background:#ECEBEF">
      <div style="display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 24px 64px;width:max-content;min-width:100%">
        <sc-for list="{{ edSheets }}" as="v" hint-placeholder-count="2">
          <dc-import name="DocSheet" page="{{ v.page }}" variant="word" zoom="{{ v.zoom }}" editable="{{ true }}" on-field="{{ v.onField }}" resolved="{{ v.resolved }}" values="{{ v.values }}" year-shift="{{ v.shift }}" replaces="{{ v.reps }}" sig="{{ v.sig }}" no-hand="{{ v.noHand }}" num="{{ v.num }}" hint-size="595px,842px"></dc-import>
        </sc-for>
      </div>
    </div>
    <aside style="background:#fff;border-left:1px solid #ECEAF0;display:flex;flex-direction:column;min-height:0">
      <div style="flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:17px;font-weight:800">Редактор</span><span style="font-size:13px;line-height:1.45;color:#5B6478">Нажмите на текст, чтобы его изменить. Поля и галочки редактируются на странице. Правки сохраняются до перезагрузки вкладки.</span></div>
        <sc-if value="{{ edOpenDoubts }}"><button onClick="{{ goResultCheck }}" style="display:flex;gap:10px;align-items:center;padding:12px;border:none;border-radius:14px;background:#FFF6DA;cursor:pointer;text-align:left"><span class="material-symbols-rounded" style="font-size:20px;color:#9A5B00">priority_high</span><span style="flex:1;font-size:13px;font-weight:700;color:#3B2600">{{ edOpenDoubts }}</span><span class="material-symbols-rounded" style="font-size:18px;color:#9A5B00">chevron_right</span></button></sc-if>
        <sc-if value="{{ hasFields }}">
          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-size:14px;font-weight:800">Поля документа</span>
            <sc-for list="{{ fieldRows }}" as="f"><label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#5B6478">{{ f.label }} · стр. {{ f.pn }}<input value="{{ f.v }}" onChange="{{ f.onChange }}" style="height:38px;border:1px solid #E3E1EA;border-radius:10px;padding:0 10px;font-size:14px;color:#0B1024;outline:none;font-weight:500" style-focus="border-color:#1F4EF5"></label></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ hasReps }}"><div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:800">Замены</span><sc-for list="{{ repList }}" as="r"><div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#F1F5FF;font-size:13px"><span style="flex:1">«{{ r.a }}» → «{{ r.b }}»</span><button onClick="{{ r.onRemove }}" title="Отменить" style="border:none;background:none;color:#5B6478;cursor:pointer;display:flex"><span class="material-symbols-rounded" style="font-size:18px">close</span></button></div></sc-for></div></sc-if>
        <button onClick="{{ edSig }}" style="height:42px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;color:#0B1024;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><span class="material-symbols-rounded" style="font-size:19px">draw</span>{{ edSigLabel }}</button>
      </div>
      <div style="border-top:1px solid #ECEAF0;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;background:#FCFCFD">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px"><img src="{{ dlInfo.img }}" alt="" style="width:28px;height:28px;flex:none;margin:-6px -4px -6px -6px"><span style="flex:1;line-height:1.4;color:#3A4156">{{ dlInfo.text }}</span></div>
        <button onClick="{{ dlDocx }}" style="height:48px;border:none;border-radius:999px;background:#1F4EF5;color:#fff;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><span class="material-symbols-rounded" style="font-size:20px">download</span>Скачать Word</button>
        <button onClick="{{ goResult }}" style="height:40px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;color:#0B1024;font-size:13px;font-weight:800;cursor:pointer">Сравнить с фото</button>
      </div>
    </aside>
  </div>
</div>
</sc-if>
