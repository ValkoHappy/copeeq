<sc-if value="{{ isDocs }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Мои документы" style="max-width:1240px;margin:0 auto;padding:36px 40px 64px;display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;align-items:flex-end;gap:14px 20px;flex-wrap:wrap">
    <div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:36px;font-weight:800;letter-spacing:-0.04em">Мои документы</h1><span style="font-size:14px;color:#5B6478">{{ keepNote }}</span></div>
    <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;width:300px;max-width:100%"><span class="material-symbols-rounded" style="font-size:20px;color:#8A90A2">search</span><input value="{{ docsQ }}" onChange="{{ onDocsQ }}" placeholder="Поиск по названию" style="flex:1;min-width:0;border:none;outline:none;font-size:14px;background:transparent;color:#0B1024"></label>
  </div>
  <sc-if value="{{ docsEmpty }}">
    <div onClick="{{ pickFile }}" style="border:2px dashed #C9D3E8;background:#fff;border-radius:28px;padding:64px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer" style-hover="border-color:#1F4EF5">
      <img src="{{ newIco }}" alt="" style="width:68px;height:68px;flex:none">
      <span style="font-size:20px;font-weight:800">{{ docsEmptyTitle }}</span><span style="font-size:14px;color:#5B6478">Перетащите фото или PDF — документ появится здесь.</span>
    </div>
  </sc-if>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px">
    <sc-for list="{{ docCards }}" as="d" hint-placeholder-count="3">
      <div style="background:#fff;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(11,16,36,.04)">
        <button onClick="{{ d.onOpen }}" style="height:210px;border:none;border-radius:16px;background:#ECEBEF;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:0;position:relative">
          <dc-import name="DocSheet" page="{{ d.page }}" variant="{{ d.variant }}" zoom="0.27" blur="{{ d.blur }}" hint-size="161px,227px"></dc-import>
          <span style="position:absolute;left:10px;top:10px;height:26px;padding:0 10px;border-radius:13px;background:{{ d.stBg }};color:{{ d.stFg }};font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px">{{ d.stLabel }}</span>
        </button>
        <div style="display:flex;flex-direction:column;gap:3px;padding:0 4px"><span style="font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.type }} · {{ d.date }}</span><span style="font-size:12px;color:#5B6478">{{ d.meta }}</span></div>
        <div style="display:flex;gap:6px;padding:0 4px 4px">
          <button onClick="{{ d.onOpen }}" style="flex:1;height:38px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;color:#0B1024;font-size:13px;font-weight:800;cursor:pointer" style-hover="border-color:#1F4EF5">{{ d.openLabel }}</button>
          <sc-if value="{{ d.canDl }}"><button onClick="{{ d.onDl }}" title="Скачать снова" style="width:38px;height:38px;border:1px solid #E3E1EA;border-radius:19px;background:#fff;color:#0B1024;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="border-color:#1F4EF5"><span class="material-symbols-rounded" style="font-size:19px">download</span></button></sc-if>
          <button onClick="{{ d.onDel }}" title="Удалить сейчас" style="width:38px;height:38px;border:1px solid #E3E1EA;border-radius:19px;background:#fff;color:#5B6478;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="border-color:#F3C9CC;color:#C2272D"><span class="material-symbols-rounded" style="font-size:19px">delete</span></button>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>
