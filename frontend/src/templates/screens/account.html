<sc-if value="{{ isAccount }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Профиль" style="max-width:820px;margin:0 auto;padding:36px 40px 64px;display:flex;flex-direction:column;gap:18px">
  <h1 style="margin:0 0 6px;font-size:36px;font-weight:800;letter-spacing:-0.04em">Профиль</h1>
  <div style="background:#fff;border-radius:24px;padding:6px 24px">
    <div style="display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #F1F0F4"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:#8A90A2;font-weight:700">Почта</span><span style="font-size:16px;font-weight:800">{{ email }}</span></span><button onClick="{{ logout }}" style="height:40px;padding:0 16px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;font-size:14px;font-weight:800;cursor:pointer">Выйти</button></div>
    <div style="display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #F1F0F4"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:#8A90A2;font-weight:700">Сохранённая подпись</span><sc-if value="{{ savedSig }}"><img src="{{ savedSig }}" alt="Подпись" style="height:44px;width:auto;align-self:flex-start;mix-blend-mode:multiply"></sc-if><sc-if value="{{ noSavedSig }}"><span style="font-size:15px;color:#5B6478">Пока нет. Можно добавить в редакторе документа.</span></sc-if></span><sc-if value="{{ savedSig }}"><button onClick="{{ delSavedSig }}" style="height:40px;padding:0 16px;border:1px solid #F3C9CC;border-radius:999px;background:#fff;color:#C2272D;font-size:14px;font-weight:800;cursor:pointer">Удалить</button></sc-if></div>
    <div style="display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #F1F0F4;flex-wrap:wrap"><span style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">Режим по умолчанию</span><span style="font-size:13px;color:#5B6478">Будет выбран при загрузке нового документа</span></span><select value="{{ prefs.mode }}" onChange="{{ onPrefMode }}" style="height:40px;border:1px solid #E3E1EA;border-radius:10px;padding:0 10px;font-size:14px;background:#fff"><option value="copy">Копия</option><option value="clean">Чистовик</option></select><select value="{{ prefs.std }}" onChange="{{ onPrefStd }}" style="height:40px;border:1px solid #E3E1EA;border-radius:10px;padding:0 10px;font-size:14px;background:#fff"><option value="gost">Настройки делового документа</option><option value="study">Учебная работа</option></select></div>
    <div style="display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #F1F0F4;flex-wrap:wrap"><span style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">Хранить документы</span><span style="font-size:13px;color:#5B6478">Срок хранения в настройках аккаунта</span></span><div style="display:flex;padding:3px;background:#F1F0F4;border-radius:999px;gap:3px"><sc-for list="{{ keepOpts }}" as="k"><button onClick="{{ k.onClick }}" style="height:34px;padding:0 14px;border:none;border-radius:999px;background:{{ k.bg }};color:{{ k.fg }};font-size:13px;font-weight:800;cursor:pointer;box-shadow:{{ k.shadow }}">{{ k.label }}</button></sc-for></div></div>
    <div style="display:flex;align-items:center;gap:14px;padding:18px 0;flex-wrap:wrap"><span style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">Ваши данные</span><span style="font-size:13px;color:#5B6478">Документы и история операций аккаунта</span></span><button onClick="{{ exportData }}" style="height:40px;padding:0 16px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;font-size:14px;font-weight:800;cursor:pointer">Выгрузить</button><button onClick="{{ askDelAccount }}" style="height:40px;padding:0 16px;border:1px solid #F3C9CC;border-radius:999px;background:#fff;color:#C2272D;font-size:14px;font-weight:800;cursor:pointer">Удалить аккаунт</button></div>
  </div>
</div>
</sc-if>
