<sc-if value="{{ isForms }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Бланки" style="max-width:1240px;margin:0 auto;padding:40px 40px 48px;display:flex;flex-direction:column;gap:26px">
  <div style="display:flex;flex-direction:column;gap:12px;max-width:760px"><h1 style="margin:0;font-size:clamp(34px,3.6vw,46px);line-height:1;font-weight:800;letter-spacing:-0.05em">Бланки в Word</h1><p style="margin:0;font-size:18px;line-height:1.5;color:#4A5368">Примеры заявлений, анкет и актов. Выберите подходящий бланк и проверьте требования организации, в которую его подаёте.</p></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid #E3E1EA;border-radius:999px;background:#fff;width:320px;max-width:100%"><span class="material-symbols-rounded" style="font-size:20px;color:#8A90A2">search</span><input value="{{ formQ }}" onChange="{{ onFormQ }}" placeholder="Например, заявление на отпуск" style="flex:1;min-width:0;border:none;outline:none;font-size:14px;background:transparent"></label>
    <sc-for list="{{ formChips }}" as="c" hint-placeholder-count="6"><button onClick="{{ c.onClick }}" style="height:38px;padding:0 14px;border-radius:999px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-size:14px;font-weight:700;cursor:pointer">{{ c.label }}</button></sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
    <sc-for list="{{ formCards }}" as="f" hint-placeholder-count="6"><button onClick="{{ f.onClick }}" style="background:#fff;border:none;border-radius:24px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left" style-hover="box-shadow:0 14px 30px rgba(11,16,36,.08)"><span style="width:84px;height:110px;flex:none;border-radius:10px;background:#ECEBEF;display:flex;align-items:center;justify-content:center;overflow:hidden"><dc-import name="DocSheet" page="{{ f.page }}" variant="word" zoom="0.12" flat="{{ true }}" blank="{{ true }}" hint-size="71px,101px"></dc-import></span><span style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="font-size:15px;font-weight:800;color:#0B1024;line-height:1.3">{{ f.title }}</span><span style="font-size:12px;color:#5B6478">{{ f.catLabel }}</span></span></button></sc-for>
  </div>
  <sc-if value="{{ formsEmpty }}"><div style="padding:40px;text-align:center;font-size:15px;color:#5B6478">По этому запросу бланков нет. Попробуйте другое название или загрузите свой документ.</div></sc-if>
</div>
</sc-if>
