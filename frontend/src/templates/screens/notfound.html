<sc-if value="{{ isNotfound }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="404" style="max-width:760px;margin:0 auto;padding:80px 40px;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center">
  <span style="font-family:Caveat,cursive;font-size:36px;color:#1F4EF5;transform:rotate(-3deg)">Страница не найдена</span>
  <h1 style="margin:0;font-size:clamp(56px,8vw,96px);line-height:1;font-weight:800;letter-spacing:-0.06em">404</h1>
  <p style="margin:0;font-size:17px;color:#4A5368">Проверьте адрес или вернитесь на главную страницу.</p>
  <div onClick="{{ pickFile }}" style="width:100%;border:2px dashed #C9D3E8;background:#fff;border-radius:24px;padding:36px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer" style-hover="border-color:#1F4EF5"><img src="{{ upIco }}" alt="" style="width:64px;height:64px"><span style="font-size:18px;font-weight:800">Перетащите фото или PDF</span></div>
  <button onClick="{{ goHome }}" style="border:none;background:none;font-size:15px;font-weight:800;color:#1F4EF5;cursor:pointer">На главную</button>
</div>
</sc-if>
